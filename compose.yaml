name: taskflow-api

x-app-environment: &app-environment
  APP_NAME: TaskFlow API
  APP_ENV: local
  APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  LOG_CHANNEL: stack
  LOG_STACK: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DOCKER_DB_DATABASE:-taskflow_dev}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-taskflow_app}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-taskflow_local_password}
  CACHE_STORE: redis
  SESSION_DRIVER: database
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  MAIL_MAILER: log

x-app-build: &app-build
  context: .
  target: development
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-app-volumes: &app-volumes
  - .:/var/www/html
  - vendor-data:/var/www/html/vendor

services:
  setup:
    build: *app-build
    environment: *app-environment
    command: >-
      sh -c "composer install --no-interaction --prefer-dist --no-progress
      && php artisan package:discover --ansi
      && php artisan migrate --force"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    build: *app-build
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DOCKER_DB_DATABASE:-taskflow_dev}
      POSTGRES_USER: ${DOCKER_DB_USERNAME:-taskflow_app}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-taskflow_local_password}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: *app-build
    environment: *app-environment
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=default
      - --sleep=1
      - --tries=3
      - --backoff=5
      - --timeout=60
    volumes: *app-volumes
    depends_on:
      setup:
        condition: service_completed_successfully
    stop_grace_period: 65s
    restart: unless-stopped

  scheduler:
    build: *app-build
    environment: *app-environment
    command: ["php", "artisan", "schedule:work"]
    volumes: *app-volumes
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  test:
    build: *app-build
    profiles: ["tools"]
    environment:
      <<: *app-environment
      APP_ENV: testing
      DB_DATABASE: taskflow_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    command: ["php", "artisan", "test", "--compact"]
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  postman:
    image: postman/newman:6-alpine
    profiles: ["tools"]
    command:
      - run
      - /etc/newman/TaskFlow-API.postman_collection.json
      - --environment
      - /etc/newman/TaskFlow-Local.postman_environment.json
      - --env-var
      - app_url=http://nginx
      - --env-var
      - base_url=http://nginx/api
      - --reporters
      - cli
    volumes:
      - ./docs/postman:/etc/newman:ro
    depends_on:
      nginx:
        condition: service_healthy
    restart: "no"

  vite:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_APP_NAME: TaskFlow API
    volumes:
      - .:/var/www/html
      - node-modules-data:/var/www/html/node_modules
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  vendor-data:
  node-modules-data:
