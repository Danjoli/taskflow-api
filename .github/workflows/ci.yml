name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and code quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow_app
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow_app -d taskflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: taskflow_test
      DB_USERNAME: taskflow_app
      DB_PASSWORD: ci_test_password
      DB_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pgsql, xml, dom, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build development container
        run: docker build --target development --tag taskflow-api:ci .

      - name: Run Postman end-to-end collection
        env:
          APP_PORT: 8001
          DB_FORWARD_PORT: 5433
          REDIS_FORWARD_PORT: 6380
        run: docker compose run --rm postman

      - name: Show end-to-end service logs
        if: failure()
        env:
          APP_PORT: 8001
          DB_FORWARD_PORT: 5433
          REDIS_FORWARD_PORT: 6380
        run: docker compose logs --no-color postgres redis setup app nginx

      - name: Stop end-to-end environment
        if: always()
        env:
          APP_PORT: 8001
          DB_FORWARD_PORT: 5433
          REDIS_FORWARD_PORT: 6380
        run: docker compose down --volumes

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Pest tests
        run: ./vendor/bin/pest

      - name: Run static analysis
        run: composer analyse

      - name: Check code formatting
        run: ./vendor/bin/pint --test
